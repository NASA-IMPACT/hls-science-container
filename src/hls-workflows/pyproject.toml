[project]
name = "hls-workflows"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Chris Holden", email = "ceholden@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.42.34",
    "click>=8.1",
    "hls-utilities",
    "psutil>=6.0",
]

[project.scripts]
hls-workflows = "hls_workflows.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "boto3-stubs[logs,s3]>=1.36.0",
    "moto[s3]>=5.0.0",
    "mypy>=1.14.0",
    "pytest>=9.0.2",
    "ruff>=0.9.0",
    "types-psutil>=7.2.2.20260408",
]

[dependency-groups]
dev = [
    "hls-workflows[dev]",
]

[tool.uv.sources]
hls-utilities = { path = "../hls-utilities" }

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP"]
ignore = ["E501", "E731"]

[tool.ruff.lint.isort]
known-first-party = ["hls_utilities", "hls_workflows"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pixi.package]
name = "hls-workflows"

[tool.pixi.package.host-dependencies]
hatchling = "*"

[tool.pixi.package.build]
# Use the pixi-build-python backend for Python packages
backend = { name = "pixi-build-python", version = "*" }

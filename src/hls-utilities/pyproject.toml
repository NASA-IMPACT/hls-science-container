[project]
name = "hls-utilities"
version = "1.11.4"
description = "Python utilities for HLS data processing"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3",
    "espa-python-library @ git+https://github.com/USGS-EROS/espa-python-library.git@v2.0.0",
    "lxml",
    "numpy",
    "rasterio",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project.optional-dependencies]
dev = [
    "moto[s3]>=5.0.0",
    "pytest>=9.0.2",
    "ruff>=0.9.0",
]

[dependency-groups]
dev = [
    "hls-utilities[dev]",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP"]
ignore = ["E501", "E731"]

[tool.ruff.lint.isort]
known-first-party = ["hls_utilities"]

context:
  version: "0.1.3.6845c47"
  # Pinned to the current HEAD of the espa-surface-reflectance `refactor`
  # branch. The Rust LaSRC is not yet released/tagged; bump this rev as the
  # branch advances.
  rev: "6845c471a9ab631a62ecf96741528754aa861510"

package:
  name: lasrc-rs
  version: ${{ version }}

build:
  number: 0
  script: build.sh

source:
  git: https://github.com/NASA-IMPACT/espa-surface-reflectance
  rev: ${{ rev }}

requirements:
  build:
    - rust
  host:
    - python 3.13.*
    - pip
    # maturin is the PEP 517 build backend; with --no-build-isolation it must
    # be importable from the host python that runs `pip install`.
    - maturin
  run:
    - python 3.13.*
    - numpy >=1.24
    - rasterio >=1.3
    - h5py >=3.8
    - pyhdf >=0.10
    - lxml >=4.9
    - click >=8.1

tests:
  - package_contents:
      files:
        exists:
          - bin/lasrc-landsat
          - bin/lasrc-sentinel
  - script:
      - lasrc-landsat --help
      - lasrc-sentinel --help
  - python:
      imports:
        - lasrc.pipeline

context:
  version: "3.5.0"

package:
  name: espa-product-formatter
  version: ${{ version }}

build:
  number: 0
  script: build.sh

source:
  git: https://github.com/NASA-IMPACT/espa-product-formatter
  branch: ${{ version }}
  patches:
    - patches/espa-product-formatter-std-gnu90.patch

requirements:
  build:
    - binutils
    - git
    - make
    - gfortran
    - gcc
  host:
    - geotiff
    - jbig
    - libtiff
    - libpng
    - hdf4
    # hdf5 2.x builds of libgdal-hdf5 require proj 9.8+, which rasterio doesn't
    # support yet. Pin to hdf5 1.14.x to stay on the proj 9.7.x-compatible
    # libgdal builds. Drop once conda-forge/rasterio-feedstock#340 lands.
    - hdf5 <2
    - hdfeos2
    - hdfeos5
    - netcdf4
    # rasterio requires proj <9.8 (all current conda-forge builds).
    # Drop once conda-forge/rasterio-feedstock#340 lands.
    - proj <9.8
    - libaec
    - libidn11
    - liblzma
    - liblzma-devel
    - libfreetype
    - libxml2
    - libxml2-devel
    - xz-tools  # FIXME: do we need?
    - xz-gpl-tools  # FIXME: do we need?
    - openmp
  run:
    # for obj_decompress program
    - openjpeg
    # for gdal_translate program
    - gdal
  run_exports:
    # lib_espa_common.a links against libxml2 for ESPA metadata (XML) parsing;
    # downstream packages that link this static lib need it at runtime
    - libxml2

tests:
  - package_contents:
      include:
        - espa_common.h
      lib:
        - lib_espa_common.a
      files:
        exists:
          - bin/convert_espa_to_hdf
          - schema/espa_internal_metadata_v2_2.xsd

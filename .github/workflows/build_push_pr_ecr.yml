name: Build, Test, and Push Pull Requests to ECR

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: hls-science-container
  BUILD_PLATFORM: linux/amd64

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.packages }}
      other: ${{ steps.filter.outputs.other }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            packages:
              - 'packages/**'
            other:
              - '**'
              - '!packages/**'

  build-conda:
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest

    env:
      S3_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_REGION: ${{ env.AWS_REGION }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/free-disk-space

      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          environments: ""
          run-install: false

      - name: Install rattler-build
        run: pixi global install rattler-build

      - name: Build espa-product-formatter
        run: |
          rattler-build build \
            --recipe packages/espa-product-formatter/recipe.yml \
            --output-dir /tmp/conda-output \
            --channel "s3://${{ secrets.CONDA_CHANNEL_BUCKET }}" \
            --channel conda-forge \
            --skip-existing=all

      - name: Build espa-surface-reflectance
        run: |
          rattler-build build \
            --recipe packages/espa-surface-reflectance/recipe.yml \
            --output-dir /tmp/conda-output \
            --channel /tmp/conda-output \
            --channel "s3://${{ secrets.CONDA_CHANNEL_BUCKET }}" \
            --channel conda-forge \
            --skip-existing=all

      - name: Build hls-libs
        run: |
          rattler-build build \
            --recipe packages/hls-libs/recipe.yml \
            --output-dir /tmp/conda-output \
            --channel /tmp/conda-output \
            --channel "s3://${{ secrets.CONDA_CHANNEL_BUCKET }}" \
            --channel conda-forge \
            --skip-existing=all

      - name: Verify new packages were built
        # Skipped for docs:/chore:/ci: PRs where a version bump is not expected
        if: |
          !startsWith(github.event.pull_request.title, 'docs:') &&
          !startsWith(github.event.pull_request.title, 'chore:') &&
          !startsWith(github.event.pull_request.title, 'ci:')
        run: |
          count=$(find /tmp/conda-output/linux-64 -name "*.conda" 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::No new packages were built — all versions are already published. Bump the version in the recipe."
            exit 1
          fi
          echo "Built $count new package(s)"

  build-push-docker:
    needs: [changes, build-conda]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.other == 'true' &&
      (needs.build-conda.result == 'success' || needs.build-conda.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/free-disk-space

      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          frozen: true
          environments: dev

      - name: Lint code
        run: |
          scripts/lint
          scripts/typecheck

      - name: Run tests
        run: |
          scripts/test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=ref,event=pr,prefix=pr-
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute pixi.lock hash
        run: echo "LOCK_HASH=$(sha256sum pixi.lock | awk '{print $1}')" >> $GITHUB_ENV

      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true  # Puts the image in 'docker images' for the next step
          provenance: false
          sbom: false
          target: prod
          build-args: |
            PLATFORM=${{ env.BUILD_PLATFORM }}
            LOCK_HASH=${{ env.LOCK_HASH }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ env.ECR_REPOSITORY }}:local
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:cache

      - name: Run container tests
        run: |
          docker run --rm ${{ env.ECR_REPOSITORY }}:local echo "placeholder"

      - name: Push to ECR
        if: success()
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag ${{ env.ECR_REPOSITORY }}:local "$tag"
            docker push "$tag"
          done <<< "$TAGS"

name: Build, Test, and Push Pull Requests to ECR

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write # required for requesting the JWT (for OIDC)
  contents: read  # required for actions/checkout
  pull-requests: read  # required for dorny/paths-filter on pull_request

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: hls-science-container
  BUILD_PLATFORM: linux/amd64

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.packages }}
      other: ${{ steps.filter.outputs.other }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            packages:
              # Only added/modified: removing a package needs no build, and the
              # "new packages were built" check would fail with nothing to build.
              - added|modified: 'packages/**'
            other:
              - 'src/**'
              - 'Dockerfile'
              - 'pixi.toml'
              - 'pixi.lock'
              - 'scripts/**'
              - '.github/**'

  build-conda:
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest

    env:
      # rattler-build upload s3 / rattler-index s3 use S3_* vars
      S3_REGION: ${{ vars.AWS_REGION }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          environments: ""
          run-install: false

      - name: Install rattler-build
        run: pixi global install rattler-build

      - name: Authenticate rattler-build with S3
        run: |
          rattler-build auth login "s3://${{ secrets.CONDA_CHANNEL_BUCKET }}" \
            --s3-access-key-id "$AWS_ACCESS_KEY_ID" \
            --s3-secret-access-key "$AWS_SECRET_ACCESS_KEY" \
            --s3-session-token "$AWS_SESSION_TOKEN"

      - name: Build conda packages
        uses: ./.github/actions/build-conda-packages
        with:
          channel-bucket: ${{ secrets.CONDA_CHANNEL_BUCKET }}
          recipes: |
            packages/espa-product-formatter/recipe.yml
            packages/espa-surface-reflectance/recipe.yml
            packages/hls-libs/recipe.yml
            packages/lasrc-rs/recipe.yml

      - name: Verify new packages were built
        # Skipped for docs:/chore:/ci: PRs where a version bump is not expected
        if: |
          !startsWith(github.event.pull_request.title, 'docs:') &&
          !startsWith(github.event.pull_request.title, 'chore:') &&
          !startsWith(github.event.pull_request.title, 'ci:')
        run: |
          count=$(find /tmp/conda-output/linux-64 -name "*.conda" 2>/dev/null | wc -l)
          # if [ "$count" -eq 0 ]; then
          #   echo "::error::No new packages were built — all versions are already published. Bump the version in the recipe."
          #   exit 1
          # fi
          echo "Built $count new package(s)"

  build-push-docker:
    needs: [changes, build-conda]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.build-conda.result != 'failure' &&
      needs.build-conda.result != 'cancelled' &&
      needs.changes.outputs.other == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/free-disk-space

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=ref,event=pr,prefix=pr-
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute pixi.lock hash
        run: echo "LOCK_HASH=$(sha256sum pixi.lock | awk '{print $1}')" >> $GITHUB_ENV

      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true  # Puts the image in 'docker images' for the next step
          provenance: false
          sbom: false
          target: prod
          build-args: |
            PLATFORM=${{ env.BUILD_PLATFORM }}
            LOCK_HASH=${{ env.LOCK_HASH }}
            GIT_SHA=${{ github.sha }}
          secrets: |
            aws_access_key_id=${{ env.AWS_ACCESS_KEY_ID }}
            aws_secret_access_key=${{ env.AWS_SECRET_ACCESS_KEY }}
            aws_session_token=${{ env.AWS_SESSION_TOKEN }}
          tags: ${{ env.ECR_REPOSITORY }}:local
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:cache

      - name: Run container tests
        run: scripts/test-container ${{ env.ECR_REPOSITORY }}:local

      - name: Push to ECR
        if: success()
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag ${{ env.ECR_REPOSITORY }}:local "$tag"
            docker push "$tag"
          done <<< "$TAGS"

name: Publish Conda Packages

on:
  push:
    branches: [main]
    paths:
      - packages/**
  workflow_dispatch:

env:
  AWS_REGION: us-west-2

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    env:
      # rattler-build build --channel s3://... uses AWS_* vars
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-west-2
      # rattler-build upload s3 / rattler-index s3 use S3_* vars
      S3_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_REGION: us-west-2

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/free-disk-space

      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          environments: ""
          run-install: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install rattler-build and rattler-index
        run: |
          pixi global install rattler-build rattler-index

      - name: Authenticate rattler-build with S3
        run: |
          rattler-build auth login "s3://${{ secrets.CONDA_CHANNEL_BUCKET }}" \
            --s3-access-key-id "$S3_ACCESS_KEY_ID" \
            --s3-secret-access-key "$S3_SECRET_ACCESS_KEY"

      - name: Build espa-product-formatter
        run: |
          rattler-build build \
            --recipe packages/espa-product-formatter/recipe.yml \
            --output-dir /tmp/conda-output \
            --channel "s3://${{ secrets.CONDA_CHANNEL_BUCKET }}" \
            --channel conda-forge \
            --skip-existing=all

      - name: Build espa-surface-reflectance
        run: |
          rattler-build build \
            --recipe packages/espa-surface-reflectance/recipe.yml \
            --output-dir /tmp/conda-output \
            --channel /tmp/conda-output \
            --channel "s3://${{ secrets.CONDA_CHANNEL_BUCKET }}" \
            --channel conda-forge \
            --skip-existing=all

      - name: Build hls-libs
        run: |
          rattler-build build \
            --recipe packages/hls-libs/recipe.yml \
            --output-dir /tmp/conda-output \
            --channel /tmp/conda-output \
            --channel "s3://${{ secrets.CONDA_CHANNEL_BUCKET }}" \
            --channel conda-forge \
            --skip-existing=all

      - name: Count new packages
        id: count
        run: |
          n=$(find /tmp/conda-output/linux-64 -name "*.conda" 2>/dev/null | wc -l)
          echo "new_packages=$n" >> "$GITHUB_OUTPUT"
          echo "New packages to publish: $n"

      - name: Upload and index packages
        if: steps.count.outputs.new_packages != '0'
        run: |
          rattler-build upload s3 \
            --channel "s3://${{ secrets.CONDA_CHANNEL_BUCKET }}" \
            /tmp/conda-output/linux-64/*.conda
          rattler-index s3 "s3://${{ secrets.CONDA_CHANNEL_BUCKET }}"

      - name: Update pixi.lock and open PR
        if: steps.count.outputs.new_packages != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          branch="chore/update-pixi-lock-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          pixi lock
          git add pixi.lock
          git commit -m "chore: update pixi.lock after conda package publish"
          git push origin "$branch"
          gh pr create \
            --title "chore: update pixi.lock after conda package publish" \
            --body "Automated lock file update following \`publish_conda_packages\` workflow run." \
            --base main \
            --head "$branch"

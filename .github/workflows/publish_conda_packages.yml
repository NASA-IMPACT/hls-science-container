name: Publish Conda Packages

on:
  push:
    branches: [main]
    paths:
      - packages/**
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    env:
      # rattler-build build --channel s3://... uses AWS_* vars
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # rattler-build upload s3 / rattler-index s3 use S3_* vars
      S3_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_REGION: ${{ vars.AWS_REGION }}
      S3_ENDPOINT_URL: https://s3.${{ vars.AWS_REGION }}.amazonaws.com

    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          environments: ""
          run-install: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install rattler-build and rattler-index
        run: |
          pixi global install rattler-build rattler-index

      - name: Authenticate rattler-build with S3
        run: |
          rattler-build auth login "s3://${{ secrets.CONDA_CHANNEL_BUCKET }}" \
            --s3-access-key-id "$S3_ACCESS_KEY_ID" \
            --s3-secret-access-key "$S3_SECRET_ACCESS_KEY"

      - name: Build conda packages
        uses: ./.github/actions/build-conda-packages
        with:
          channel-bucket: ${{ secrets.CONDA_CHANNEL_BUCKET }}
          recipes: |
            packages/espa-product-formatter/recipe.yml
            packages/espa-surface-reflectance/recipe.yml
            packages/hls-libs/recipe.yml
            packages/lasrc-rs/recipe.yml

      - name: Count new packages
        id: count
        run: |
          files=$(find /tmp/conda-output/linux-64 -name "*.conda" 2>/dev/null || true)
          n=$(echo "$files" | grep -c . || true)
          packages=$(echo "$files" | xargs -I{} basename {} .conda | sed 's/-[0-9v].*//' | tr '\n' ' ')
          echo "new_packages=$n" >> "$GITHUB_OUTPUT"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "New packages to publish: $n ($packages)"

      - name: Upload and index packages
        if: steps.count.outputs.new_packages != '0'
        run: |
          rattler-build upload s3 \
            --channel "s3://${{ secrets.CONDA_CHANNEL_BUCKET }}" \
            /tmp/conda-output/linux-64/*.conda
          rattler-index s3 "s3://${{ secrets.CONDA_CHANNEL_BUCKET }}"

      - name: Bump pixi.toml pins and open PR
        if: steps.count.outputs.new_packages != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          # Dependencies from the S3 channel are exact-pinned in pixi.toml
          # (`name = "=version"`), so `pixi update` alone never picks up a new
          # version. Rewrite the pin to the just-published version instead.
          # Packages not exact-pinned (e.g. published before being wired into
          # the manifest, or path dependencies) are left alone.
          bumped=""
          for f in /tmp/conda-output/linux-64/*.conda; do
            # <name>-<version>-<build>.conda; names may contain dashes
            base=$(basename "$f" .conda)
            rest=${base%-*}
            version=${rest##*-}
            name=${rest%-*}
            if grep -qE "^${name} = \"=[^\"]*\"" pixi.toml; then
              sed -i -E "s/^(${name} = \")=[^\"]*\"/\1=${version}\"/" pixi.toml
              bumped="$bumped ${name}=${version}"
            else
              echo "${name} is not exact-pinned in pixi.toml; skipping"
            fi
          done
          if git diff --quiet pixi.toml; then
            echo "No pins changed; skipping PR"
            exit 0
          fi
          echo "Bumped pins:$bumped"
          # rattler-build shares pixi's repodata cache and fetched the channel
          # before the upload; the S3 index is served with max-age=300, so the
          # cached copy is still "fresh" and would hide the new version.
          pixi clean cache --repodata --yes
          pixi lock
          branch="chore/bump-conda-pins-$(date +%Y%m%d-%H%M%S)"
          title="chore: bump conda package pins after publish"
          body="Automated pin bump following \`publish_conda_packages\` workflow run."$'\n'
          for b in $bumped; do
            body="$body"$'\n'"- \`$b\`"
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add pixi.toml pixi.lock
          git commit -m "$title" -m "Bumped:$bumped"
          git push origin "$branch"
          gh pr create \
            --title "$title" \
            --body "$body" \
            --base main \
            --head "$branch"

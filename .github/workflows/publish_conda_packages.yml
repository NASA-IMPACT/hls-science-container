name: Publish Conda Packages

on:
  push:
    branches: [main]
    paths:
      - packages/**
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    env:
      # rattler-build build --channel s3://... uses AWS_* vars
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # rattler-build upload s3 / rattler-index s3 use S3_* vars
      S3_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_REGION: ${{ vars.AWS_REGION }}
      S3_ENDPOINT_URL: https://s3.${{ vars.AWS_REGION }}.amazonaws.com

    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          environments: ""
          run-install: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install rattler-build and rattler-index
        run: |
          pixi global install rattler-build rattler-index

      - name: Authenticate rattler-build with S3
        run: |
          rattler-build auth login "s3://${{ secrets.CONDA_CHANNEL_BUCKET }}" \
            --s3-access-key-id "$S3_ACCESS_KEY_ID" \
            --s3-secret-access-key "$S3_SECRET_ACCESS_KEY"

      - name: Build conda packages
        uses: ./.github/actions/build-conda-packages
        with:
          channel-bucket: ${{ secrets.CONDA_CHANNEL_BUCKET }}
          recipes: |
            packages/espa-product-formatter/recipe.yml
            packages/espa-surface-reflectance/recipe.yml
            packages/hls-libs/recipe.yml
            packages/lasrc-rs/recipe.yml

      - name: Count new packages
        id: count
        run: |
          files=$(find /tmp/conda-output/linux-64 -name "*.conda" 2>/dev/null || true)
          n=$(echo "$files" | grep -c . || true)
          packages=$(echo "$files" | xargs -I{} basename {} .conda | sed 's/-[0-9v].*//' | tr '\n' ' ')
          echo "new_packages=$n" >> "$GITHUB_OUTPUT"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "New packages to publish: $n ($packages)"

      - name: Upload and index packages
        if: steps.count.outputs.new_packages != '0'
        run: |
          rattler-build upload s3 \
            --channel "s3://${{ secrets.CONDA_CHANNEL_BUCKET }}" \
            /tmp/conda-output/linux-64/*.conda
          rattler-index s3 "s3://${{ secrets.CONDA_CHANNEL_BUCKET }}"

      - name: Update pixi.lock and open PR
        if: steps.count.outputs.new_packages != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          # Only update packages that are already dependencies in pixi.toml. A
          # package can be published here before it's wired into the manifest
          # (e.g. lasrc-rs), and `pixi update <non-dependency>` errors out.
          to_update=""
          for pkg in ${{ steps.count.outputs.packages }}; do
            grep -qE "^\s*${pkg} = " pixi.toml && to_update="$to_update $pkg"
          done
          if [ -z "$to_update" ]; then
            echo "No published packages are dependencies yet; skipping lock update"
            exit 0
          fi
          echo "Updating pixi.lock for:$to_update"
          pixi update $to_update
          git diff --quiet pixi.lock && { echo "pixi.lock unchanged, nothing to commit"; exit 0; }
          branch="chore/update-pixi-lock-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add pixi.lock
          git commit -m "chore: update pixi.lock after conda package publish"
          git push origin "$branch"
          gh pr create \
            --title "chore: update pixi.lock after conda package publish" \
            --body "Automated lock file update following \`publish_conda_packages\` workflow run." \
            --base main \
            --head "$branch"

name: Publish Conda Packages

on:
  push:
    branches: [main]
    paths:
      - packages/**
  workflow_dispatch:

env:
  AWS_REGION: us-west-2

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/free-disk-space

      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          environments: ""
          run-install: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install rattler-build and conda-index
        run: |
          pixi global install rattler-build conda-index

      - name: Build espa-product-formatter
        run: |
          rattler-build build \
            --recipe packages/espa-product-formatter/recipe.yml \
            --output-dir /tmp/conda-output

      - name: Build espa-surface-reflectance
        run: |
          rattler-build build \
            --recipe packages/espa-surface-reflectance/recipe.yml \
            --output-dir /tmp/conda-output \
            --channel /tmp/conda-output \
            --channel conda-forge

      - name: Build hls-libs
        run: |
          rattler-build build \
            --recipe packages/hls-libs/recipe.yml \
            --output-dir /tmp/conda-output \
            --channel /tmp/conda-output \
            --channel conda-forge

      - name: Index channel
        run: python -m conda_index /tmp/conda-output

      - name: Upload to S3
        run: |
          aws s3 sync /tmp/conda-output/ \
            s3://${{ secrets.CONDA_CHANNEL_BUCKET }}/conda/ \
            --exclude '*' \
            --include 'linux-64/*.conda' \
            --include 'linux-64/repodata.json' \
            --include 'linux-64/repodata.json.bz2' \
            --include 'noarch/repodata.json' \
            --include 'noarch/repodata.json.bz2'

      - name: Update pixi.lock and open PR
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          branch="chore/update-pixi-lock-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          pixi lock
          git add pixi.lock
          git commit -m "chore: update pixi.lock after conda package publish"
          git push origin "$branch"
          gh pr create \
            --title "chore: update pixi.lock after conda package publish" \
            --body "Automated lock file update following \`publish_conda_packages\` workflow run." \
            --base main \
            --head "$branch"

name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      packages: ${{ steps.packages.outputs.packages }}

    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Filter names other than "shared" must match a directory in src/.
          # List a package's in-repo dependencies so it is retested when they change.
          filters: |
            shared: &shared
              - "pixi.toml"
              - "pixi.lock"
              - "pyproject.toml"
              - "scripts/test"
              - ".github/workflows/test.yml"
            hls-utilities:
              - *shared
              - "src/hls-utilities/**"
            hls-workflows:
              - *shared
              - "src/hls-workflows/**"
              - "src/hls-utilities/**"

      - name: List changed packages
        id: packages
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          echo "packages=$(jq -c 'map(select(. != "shared"))' <<< "$CHANGES")" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          frozen: true
          environments: dev

      - name: Run tests
        run: |
          scripts/test src/${{ matrix.package }}

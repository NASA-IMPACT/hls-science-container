<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HLS pipeline benchmarks</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 1100px; color: #333; }
    h1 { margin-bottom: 0.25rem; }
    .meta { color: #666; font-size: 0.9rem; margin-bottom: 1rem; }
    .meta a { color: #3273dc; }
    .controls { margin: 0.5rem 0 1.5rem; display: flex; gap: 1.5rem; flex-wrap: wrap; align-items: center; }
    .chart-card { border: 1px solid #e2e2e2; border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; }
    .chart-card h2 { margin: 0 0 0.5rem; font-size: 1.05rem; }
    #empty { color: #888; }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <h1>HLS pipeline benchmarks</h1>
  <div class="meta"><span id="last-update"></span> &middot; <a id="repo-link" rel="noopener"></a></div>
  <div class="controls">
    <label><input type="checkbox" id="combine" checked /> Combine series (one chart per group)</label>
    <label>View:
      <select id="view">
        <option value="agg" selected>Pipeline aggregate</option>
        <option value="tasks">By task (Fmask, LaSRC)</option>
        <option value="all">All series</option>
      </select>
    </label>
    <button id="download">Download data as JSON</button>
  </div>
  <div id="charts"></div>
  <p id="empty" hidden>No benchmark data yet — this page populates after the first benchmark run pushes
    <code>data.js</code>.</p>

  <!-- Published by benchmark-action/github-action-benchmark (defines window.BENCHMARK_DATA) -->
  <script src="data.js"></script>
  <script>
    (function () {
      const SUITE = "HLS pipeline benchmarks";
      const METRICS = [
        { key: "runtime_seconds", label: "Runtime (s)" },
        { key: "peak_memory_mb", label: "Peak memory (MB)" },
        { key: "avg_cpu_percent", label: "Avg CPU (%)" },
      ];
      // Pipeline-level (aggregate) task names — everything else is a per-task series.
      const AGG_TASKS = new Set(["sentinel-ac", "landsat-ac", "landsat-tile"]);
      const PALETTE = ["#1f77b4", "#d62728", "#2ca02c", "#9467bd", "#ff7f0e", "#8c564b", "#17becf", "#e377c2"];

      // Series name format emitted by the benchmarks: "<task> <metric> [<granule>]"
      function parseName(name) {
        const m = name.match(/^(.*)\s+(\S+)\s+\[(.+)\]$/);
        return m ? { task: m[1], metric: m[2], granule: m[3] } : null;
      }

      const data = window.BENCHMARK_DATA;
      const entries = (data && data.entries && data.entries[SUITE]) || [];
      const labels = entries.map((e) => e.commit.id.slice(0, 7));
      const commits = entries.map((e) => e.commit);
      const charts = [];

      if (data) {
        document.getElementById("last-update").textContent =
          "Last update: " + new Date(data.lastUpdate).toLocaleString();
        const rl = document.getElementById("repo-link");
        rl.href = data.repoUrl;
        rl.textContent = data.repoUrl;
      }
      document.getElementById("download").onclick = () => {
        const a = document.createElement("a");
        a.href = "data:," + encodeURIComponent(JSON.stringify(data, null, 2));
        a.download = "benchmark_data.json";
        a.click();
      };

      // metric -> task -> (granule -> values aligned to commits)
      // view: "agg" (pipeline tasks only) | "tasks" (per-task only) | "all"
      function gather(view) {
        const byMetric = new Map(METRICS.map((m) => [m.key, new Map()]));
        entries.forEach((e, i) => {
          for (const b of e.benches) {
            const p = parseName(b.name);
            if (!p || !byMetric.has(p.metric)) continue;
            const isAgg = AGG_TASKS.has(p.task);
            if (view === "agg" && !isAgg) continue;
            if (view === "tasks" && isAgg) continue;
            const byTask = byMetric.get(p.metric);
            if (!byTask.has(p.task)) byTask.set(p.task, new Map());
            const byGranule = byTask.get(p.task);
            if (!byGranule.has(p.granule)) byGranule.set(p.granule, new Array(entries.length).fill(null));
            byGranule.get(p.granule)[i] = b.value;
          }
        });
        return byMetric;
      }

      function dataset(name, values, idx) {
        const color = PALETTE[idx % PALETTE.length];
        return { label: name, data: values, borderColor: color, backgroundColor: color, spanGaps: true, tension: 0.2 };
      }

      function makeChart(title, datasets, yLabel) {
        const card = document.createElement("div");
        card.className = "chart-card";
        const h2 = document.createElement("h2");
        h2.textContent = title;
        const canvas = document.createElement("canvas");
        card.append(h2, canvas);
        document.getElementById("charts").append(card);
        charts.push(new Chart(canvas, {
          type: "line",
          data: { labels, datasets },
          options: {
            responsive: true,
            interaction: { mode: "index", intersect: false },
            onClick: (_e, els) => { const u = els.length && commits[els[0].index]?.url; if (u) window.open(u, "_blank"); },
            scales: { y: { beginAtZero: true, title: { display: true, text: yLabel } } },
            plugins: {
              tooltip: { callbacks: { afterTitle: (items) => (commits[items[0].dataIndex]?.message || "").split("\n")[0] } },
            },
          },
        }));
      }

      function render() {
        const combine = document.getElementById("combine").checked;
        const view = document.getElementById("view").value;
        charts.forEach((c) => c.destroy());
        charts.length = 0;
        document.getElementById("charts").innerHTML = "";
        document.getElementById("empty").hidden = entries.length > 0;

        const byMetric = gather(view);
        for (const metric of METRICS) {
          const byTask = byMetric.get(metric.key);
          if (!byTask || byTask.size === 0) continue;

          if (view === "tasks") {
            // One chart per task (Fmask, LaSRC); one line per (granule, version).
            for (const [task, byGranule] of byTask) {
              if (combine) {
                const datasets = [...byGranule.entries()].map(([g, vals], idx) => dataset(g, vals, idx));
                makeChart(`${task} - ${metric.label}`, datasets, metric.label);
              } else {
                let idx = 0;
                for (const [g, vals] of byGranule) {
                  makeChart(`${task} - ${g} - ${metric.label}`, [dataset(g, vals, idx)], metric.label);
                  idx++;
                }
              }
            }
          } else {
            // Aggregate / all: flatten to one line per "<task> [<granule>]".
            const flat = [];
            for (const [task, byGranule] of byTask)
              for (const [g, vals] of byGranule) flat.push([`${task} [${g}]`, vals]);
            if (combine) {
              // One chart per metric; one line per workflow/task.
              makeChart(metric.label, flat.map(([name, vals], idx) => dataset(name, vals, idx)), metric.label);
            } else {
              // One chart per series (no workflow combining).
              flat.forEach(([name, vals], idx) =>
                makeChart(`${name} - ${metric.label}`, [dataset(name, vals, idx)], metric.label));
            }
          }
        }
      }

      document.getElementById("combine").addEventListener("change", render);
      document.getElementById("view").addEventListener("change", render);
      render();
    })();
  </script>
</body>
</html>

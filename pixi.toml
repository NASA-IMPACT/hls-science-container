[workspace]
name = "hls-science-container"
version = "0.1.0"
platforms = ["linux-64", "osx-arm64"]
channels = ["conda-forge", "s3://hls-conda-channels/stable"]
preview = ["pixi-build"]
conda-pypi-map = { conda-forge = { mapping-mode = "replace" } }

[target.linux-64.dependencies]
# C packages can only be compiled on Linux x86_64
espa-product-formatter = "=3.5.0"
espa-surface-reflectance = "=v3.5.1.0"
hls-libs = "=v3.5.1.2"

[pypi-dependencies]
hls-utilities = { path = "./src/hls-utilities", editable = false }
hls-workflows = { path = "./src/hls-workflows", editable = false}
# Remote repositories
hls-browse-imagery-creator = { git = "https://github.com/NASA-IMPACT/hls-browse_imagery", tag = "v1.8"}
hls-cmr_stac = { git = "https://github.com/NASA-IMPACT/hls-cmr_stac", tag = "v1.9" }
hls-hdf_to_cog = { git = "https://github.com/NASA-IMPACT/hls-hdf_to_cog", tag = "v2.2" }
hls-manifest = { git = "https://github.com/NASA-IMPACT/hls-manifest", tag = "v2.1" }
metadata-creator = { git = "https://github.com/NASA-IMPACT/hls-metadata", tag = "v2.9" }
hls-thumbnails = { git = "https://github.com/NASA-IMPACT/hls-thumbnails", tag=  "v1.3" }
hls-vi = { url = "https://github.com/NASA-IMPACT/hls-vi/releases/download/v1.20.2/hls_vi-1.20.2-py3-none-any.whl" }

[dependencies]
# Dependencies we source via Conda for easier install
python = ">=3.13,<3.14"
awscliv2 = "~=2"
gdal = "*"
libgdal-hdf4 = ">=3.10.3,<4"
libgdal-hdf5 = ">=3.10.3,<4"
libgdal-jp2openjpeg = "*"
rasterio = "*"
# hls-cmr_stac (<=v1.9) JSON-dumps rasterio's transform directly, which needs
# affine.Affine to be a tuple subclass (dropped in affine 3)
affine = ">=2,<3"
pyproj = ">=3.7.2,<4"
shapely = ">=2,<3"
click = "*"
zip = "*"
unzip = "*"
# botocore (PyPI) requires python-dateutil<3, but the conda solve (fmask -> pandas,
# matplotlib) runs first and would otherwise pick 4.x
python-dateutil = ">=2.8,<3"
fmask = { git = "https://github.com/NASA-IMPACT/fmask-v5", tag = "v5.0.1.post3" }
# lasrc-rs (TODO: point to released conda package)
lasrc-rs = { git = "https://github.com/NASA-IMPACT/lasrc-rs", rev = "2c5a859d71bdb8d376281b379435ed99e8e3206e", subdirectory = "conda" }

[feature.dev.dependencies]
ruff = "*"
mypy = "*"
pytest = "*"
# dev env is no-default-feature, so core deps (incl. click) aren't inherited;
# click is needed to lint/typecheck the CLI module.
click = "*"

[feature.debug.dependencies]
ipython = "*"
matplotlib = "*"
pandas = "*"
pyarrow = "*"
scalene = "*"
py-spy = "*"

[feature.dev.pypi-dependencies]
hls-utilities = { path = "./src/hls-utilities", editable = true, extras = ["dev"] }
hls-workflows = { path = "./src/hls-workflows", editable = true, extras = ["dev"] }
# Operator tooling for submitting experiment jobs; not installed in the image.
hls-submit = { path = "./src/hls-submit", editable = true, extras = ["dev"] }
# Type stubs for boto3 clients (e.g. CloudWatchLogsClient in scripts/plot_metrics.py)
boto3-stubs = { version = ">=1", extras = ["logs"] }

[feature.benchmark.pypi-dependencies]
hls-workflows = { path = "./src/hls-workflows", editable = true, extras = ["dev"] }


[environments]
dev = { features = ["dev"], no-default-feature = true }
debug = { features = ["dev", "debug"], no-default-feature = false }
benchmark = { features = ["benchmark"] }
